name: Build Noctis iOS

on:
  push:
    tags:
      - "build-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Swift packages
        working-directory: App
        run: xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

      - name: Build unsigned iOS app
        working-directory: App
        shell: bash
        run: |
          mkdir -p build
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Create IPA and checksums
        working-directory: App
        shell: bash
        run: |
          mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/Noctis.app
          cd build
          zip -qry Noctis-1.3.1-ios.ipa Payload
          shasum -a 256 Noctis-1.3.1-ios.ipa | cut -d ' ' -f 1 > Noctis-1.3.1-ios.ipa.sha256
          stat -f%z Noctis-1.3.1-ios.ipa > Noctis-1.3.1-ios.ipa.size
          ls -lh Noctis-1.3.1-ios.ipa

      - name: Publish iOS release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.1
          name: Noctis iOS 1.3.1
          generate_release_notes: true
          files: |
            App/build/Noctis-1.3.1-ios.ipa
            App/build/Noctis-1.3.1-ios.ipa.sha256
            App/build/Noctis-1.3.1-ios.ipa.size
